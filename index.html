<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>drakepg</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0d0b12; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      canvas { touch-action: none; }
      /* The game is landscape: ask phones and tablets held upright to turn. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #0d0b12; color: #f3e9d2; font: bold 22px Georgia, "Times New Roman", serif; text-align: center;
      }
      #rotate .phone {
        width: 46px; height: 80px; border: 4px solid #f1c40f; border-radius: 10px;
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>Turn your device sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
