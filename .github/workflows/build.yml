name: Build & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Deploys only happen from pushes/manual runs on the default branch.
      - id: target
        run: echo "deploy=${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"

      # GitHub Pages must be switched on once by hand (Settings -> Pages -> Source: GitHub Actions).
      # Until then, skip the Pages deploy instead of failing.
      - id: pages
        if: steps.target.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GitHub Pages deploy. Enable it in Settings -> Pages -> Source: GitHub Actions."
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Uploads to itch.io once both are set in repo Settings -> Secrets and variables -> Actions:
      #   secret   BUTLER_API_KEY  (itch.io -> Settings -> API keys)
      #   variable ITCH_GAME       e.g. "yourname/drakepg"  (user/game from the itch.io page URL)
      - name: Deploy to itch.io
        if: steps.target.outputs.deploy == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::notice::Skipping itch.io deploy. Set secret BUTLER_API_KEY and variable ITCH_GAME to enable it."
            exit 0
          fi
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V
          ./butler/butler push dist "$ITCH_GAME:html5" --userversion "${GITHUB_SHA::7}"

  pages:
    needs: build
    if: needs.build.outputs.deploy == 'true' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
