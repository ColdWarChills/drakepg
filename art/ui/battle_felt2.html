<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- UI direction "Felt, table-top" (2026-10-18): the felt kit as it is drawn in the game (clean vector cloth, no grain),
     pushed toward the designer's references. Hearthstone: chunky pieces with thickness, the key numbers big in iconic
     tokens (a felt heart for HP, a drop for MP). Persona 5: hierarchy and angles, one big Attack and the rest smaller
     around it. Dead Space: the hero's numbers sit under the hero, the monster's next move hangs over the monster.
     Drawn by hand in code; the scene behind is a capture of the game. -->
<style>
  @font-face { font-family: Alegreya; font-weight: 800; src: url(../../unity/Assets/Resources/Fonts/Alegreya-ExtraBold.ttf); }
  @font-face { font-family: 'Alegreya Sans'; font-weight: 500; src: url(../../unity/Assets/Resources/Fonts/AlegreyaSans-Medium.ttf); }
  @font-face { font-family: 'Alegreya Sans'; font-weight: 700; src: url(../../unity/Assets/Resources/Fonts/AlegreyaSans-Bold.ttf); }
  @font-face { font-family: 'Alegreya Sans'; font-weight: 800; src: url(../../unity/Assets/Resources/Fonts/AlegreyaSans-ExtraBold.ttf); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #111; font-family: 'Alegreya Sans'; color: #f1e6cc; }
  .abs { position: absolute; }
  .name { font-family: Alegreya; font-weight: 800; font-size: 27px; line-height: 1; white-space: nowrap; }
  .name small { font-family: 'Alegreya Sans'; font-weight: 700; font-size: 18px; color: #c4b48f; margin-left: 8px; }
  .num { font-family: Alegreya; font-weight: 800; color: #fff4dc; text-align: center; line-height: 1;
    text-shadow: 0 2px 0 #3a0f08, 0 -1px 0 #3a0f08, 1px 0 0 #3a0f08, -1px 0 0 #3a0f08, 2px 2px 0 #3a0f08; }
  .bartext { font-weight: 800; font-size: 15px; color: #fff4dc; text-align: center; line-height: 1;
    text-shadow: 0 1px 0 #1a1410, 0 -1px 0 #1a1410, 1px 0 0 #1a1410, -1px 0 0 #1a1410; }
  .line { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; height: 24px; padding: 0 9px 1px; border-radius: 7px; font-weight: 800; font-size: 15px; }
  .dim { color: #c4b48f; }
  .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #3a2a1a; }
  .btn .label { font-family: Alegreya; font-weight: 800; display: flex; align-items: center; gap: 8px; line-height: 1; }
  .btn .sub { font-weight: 700; font-size: 14px; color: #5f4a33; margin-top: 3px; }
  .key { width: 26px; height: 26px; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #3a2a1a; }
  .key svg { position: absolute; inset: 0; overflow: visible; }
  .key b { position: relative; }
</style>
<script src="mocklib.js"></script>
</head>
<body>
<script>
defs();
const S = stage();
const NAVY = '#2b3650', NAVY_DARK = '#1f2738', GROOVE = '#141a28', STITCH = '#eadbb5', HEM = '#c9b48c', SAND = '#d8c59c',
  SAND_STITCH = '#7a5636', RED = '#b8402c', RED_STITCH = '#f6e3c0', LINEN = '#ece2c9', LINEN_STITCH = '#8a5a3a';

// A darker shade of a color: the felt's cut edge, seen under it (its thickness).
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = (v) => Math.round(v * (1 - k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const rr = (x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); return `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`; };

// Points along a rounded rectangle's outline, with the outward normal: for the hairy felt edge.
function outline(x, y, w, h, r, step) {
  r = Math.min(r, w / 2, h / 2);
  const pts = [], l1 = w - 2 * r, l2 = h - 2 * r, a = Math.PI * r / 2, P = 2 * l1 + 2 * l2 + 4 * a;
  const at = (s) => {
    if (s < l1) return [x + r + s, y, 0, -1]; s -= l1;
    if (s < a) { const t = -Math.PI / 2 + s / r; return [x + w - r + Math.cos(t) * r, y + r + Math.sin(t) * r, Math.cos(t), Math.sin(t)]; } s -= a;
    if (s < l2) return [x + w, y + r + s, 1, 0]; s -= l2;
    if (s < a) { const t = s / r; return [x + w - r + Math.cos(t) * r, y + h - r + Math.sin(t) * r, Math.cos(t), Math.sin(t)]; } s -= a;
    if (s < l1) return [x + w - r - s, y + h, 0, 1]; s -= l1;
    if (s < a) { const t = Math.PI / 2 + s / r; return [x + r + Math.cos(t) * r, y + h - r + Math.sin(t) * r, Math.cos(t), Math.sin(t)]; } s -= a;
    if (s < l2) return [x, y + h - r - s, -1, 0]; s -= l2;
    const t = Math.PI + s / Math.max(r, 1e-4); return [x + r + Math.cos(t) * r, y + r + Math.sin(t) * r, Math.cos(t), Math.sin(t)];
  };
  const n = Math.max(8, Math.round(P / step));
  for (let i = 0; i < n; i++) pts.push(at(i * P / n));
  return { pts, P };
}
function hairy(x, y, w, h, r, seed, fuzz) {
  const R = rng(seed);
  return path(outline(x, y, w, h, r, 1.5).pts.map(([px, py, nx, ny]) => { const o = (R() - 0.5) * fuzz; return [px + nx * o, py + ny * o]; }));
}
// Running stitches along a rounded rectangle, a whole number of dashes, a thread shadow first.
function stitches(svg, x, y, w, h, r, { dash = 7, gap = 5, width = 2.2, color = STITCH }) {
  const P = outline(x, y, w, h, r, 4).P, n = Math.max(1, Math.round(P / (dash + gap))), k = P / (n * (dash + gap));
  const d = rr(x, y, w, h, r), arr = `${dash * k} ${gap * k}`;
  el('path', { d, fill: 'none', stroke: 'rgba(0,0,0,.35)', 'stroke-width': width * 1.1, 'stroke-dasharray': arr, 'stroke-linecap': 'round', transform: 'translate(.8 1.2)' }, svg);
  el('path', { d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-dasharray': arr, 'stroke-linecap': 'round' }, svg);
}
// A felt piece: soft shadow, its thickness (the cut edge under it), the cloth with a slightly hairy edge, a padded rim, stitches.
function patch(svg, x, y, w, h, { cloth = NAVY, thread = STITCH, inset = 7, r = 16, dash = 7, gap = 5, tw = 2.2, fuzz = 1.3, rim = 0.13, thick = 4, seed = 1 } = {}) {
  for (let i = 0; i < 4; i++) { const g = i * 1.8; el('path', { d: rr(x + 2 - g, y + 6 + thick - g, w + 2 * g, h + 2 * g, r + g), fill: 'rgba(10,8,6,.1)' }, svg); }
  el('path', { d: fuzz ? hairy(x, y + thick, w, h, r, seed + 5, fuzz) : rr(x, y + thick, w, h, r), fill: shade(cloth, 0.4) }, svg);
  el('path', { d: fuzz ? hairy(x, y, w, h, r, seed, fuzz) : rr(x, y, w, h, r), fill: cloth }, svg);
  if (rim) el('path', { d: rr(x + 3, y + 3, w - 6, h - 6, Math.max(0, r - 3)), fill: 'none', stroke: `rgba(0,0,0,${rim})`, 'stroke-width': 5 }, svg);
  if (thread) stitches(svg, x + inset, y + inset, w - 2 * inset, h - 2 * inset, Math.max(3, r - inset), { dash, gap, width: tw, color: thread });
}
// A felt token in a shape (a heart, a drop): thickness, cloth, stitched outline just inside, a big number on it.
function token(svg, d, cx, cy, size, cloth, num, numSize) {
  const t = (dx, dy, s) => `translate(${cx + dx} ${cy + dy}) scale(${s}) translate(-50 -50)`;
  for (let i = 0; i < 3; i++) el('path', { d, transform: t(2, 6, size / 100 * (1 + i * 0.03)), fill: 'rgba(10,8,6,.14)' }, svg);
  el('path', { d, transform: t(0, 4, size / 100), fill: shade(cloth, 0.42) }, svg);
  el('path', { d, transform: t(0, 0, size / 100), fill: cloth }, svg);
  // Stitches just inside its outline: a thread shadow, then the thread (widths divided by the scale).
  const k = size / 100 * 0.8, dash = `${6 / k} ${4.5 / k}`;
  el('path', { d, transform: t(0.8, 1.2, k), fill: 'none', stroke: 'rgba(0,0,0,.35)', 'stroke-width': 2.2 / k, 'stroke-dasharray': dash, 'stroke-linecap': 'round' }, svg);
  el('path', { d, transform: t(0, 0, k), fill: 'none', stroke: RED_STITCH, 'stroke-width': 2 / k, 'stroke-dasharray': dash, 'stroke-linecap': 'round' }, svg);
  return div('abs num', `left:${cx - 50}px; top:${cy - numSize / 2 - 2}px; width:100px; font-size:${numSize}px`, S, num);
}
const HEART = 'M50 92 C22 72 4 54 4 32 C4 15 16 4 30 4 C40 4 47 10 50 18 C53 10 60 4 70 4 C84 4 96 15 96 32 C96 54 78 72 50 92 Z';
const DROP = 'M50 4 C58 18 88 46 88 66 C88 84 71 96 50 96 C29 96 12 84 12 66 C12 46 42 18 50 4 Z';

// A bar: a dark felt groove, a felt strip with a row of light stitches, the numbers on it.
function bar(svg, x, y, w, h, value, color, text) {
  el('path', { d: rr(x, y, w, h, h / 2), fill: GROOVE }, svg);
  const fw = Math.max(h - 6, (w - 6) * value);
  el('path', { d: rr(x + 3, y + 3, fw, h - 6, (h - 6) / 2), fill: color }, svg);
  el('path', { d: `M${x + 10} ${y + 6}H${x + fw - 6}`, stroke: 'rgba(255,240,215,.45)', 'stroke-width': 1.4, 'stroke-dasharray': '5 4', 'stroke-linecap': 'round' }, svg);
  div('abs bartext', `left:${x}px; top:${y + h / 2 - 8}px; width:${w}px`, S, text);
}
function chip(text, color, ink) { return `<span class="chip" style="background:${color}; color:${ink}">${text}</span>`; }
function key(x, y, n) {
  div('abs key', `left:${x}px; top:${y}px`, S, `<svg viewBox="0 0 26 26"><circle cx="14" cy="15" r="12" fill="rgba(0,0,0,.35)"/>
    <circle cx="13" cy="13" r="12" fill="#efe2c2" stroke="${SAND_STITCH}" stroke-width="1.6"/><circle cx="13" cy="13" r="8.5" fill="none" stroke="${HEM}"/></svg><b>${n}</b>`);
}

const svg = layer(S, 1280, 720);
const LIGHT = { ink: '#f1e6cc', paper: '#3a4a66' };

// The runner the pieces lie on.
patch(svg, -12, 540, 1304, 200, { cloth: NAVY_DARK, thread: HEM, inset: 9, r: 22, dash: 9, gap: 6, thick: 0, seed: 3 });

// --- The hero's piece, right under the hero: a big heart with HP, a drop with MP (Hearthstone), bars, statuses.
patch(svg, 24, 558, 470, 146, { seed: 11 });
token(svg, HEART, 82, 610, 92, RED, '48', 34);
token(svg, DROP, 444, 636, 70, '#3f6fb0', '20', 24);
div('abs name', 'left:140px; top:574px', S, 'Wanderer<small>Lv 3</small>');
div('abs', 'left:300px; top:574px', S, chip('Neutral', '#5d5f63', '#e8e0cc'));
bar(svg, 140, 612, 256, 24, 48 / 60, '#c8452f', '48 / 60');
bar(svg, 140, 646, 256, 18, 20 / 30, '#4a7cc0', '20 / 30');
div('abs line', 'left:140px; top:672px', S, chip('War Cry 2', '#3f5a3c', '#cfe8c0') + chip('Bleed 1', '#6b3a34', '#ffc4b8'));

// --- The monster's piece: heart with its HP, weak spots as chips, its trait, its loot.
patch(svg, 852, 16, 412, 196, { seed: 12 });
token(svg, HEART, 852, 52, 84, RED, '46', 31);
div('abs name', 'left:906px; top:32px', S, 'Thornback Boar<small>Lv 2</small>');
bar(svg, 906, 66, 336, 22, 1, '#c8452f', '46 / 46');
div('abs line', 'left:882px; top:104px', S, icon('flame', 24, LIGHT) + '<span class="dim">Weak</span>' + chip('Water', '#2f4f7a', '#bcd8ff') + chip('Wind', '#2f5d55', '#b8f0dc') + chip('Energy', '#5d5530', '#fff0a8'));
div('abs line', 'left:882px; top:140px; color:#d9bdf0', S, icon('star', 24, LIGHT) + 'Opens with a Thorn Charge.');
div('abs line', 'left:882px; top:172px; font-size:15px', S, icon('bag', 24, LIGHT) + '<span class="dim">Gear</span> <span style="color:#f0c75a">Rare 1.0%</span> <span style="color:#9ad48a">Uncommon 5.0%</span> Common 5.6%');

// --- Its next move hangs right over it (Dead Space: on the thing itself).
patch(svg, 812, 236, 268, 42, { inset: 5, r: 10, dash: 5, gap: 4, tw: 1.8, thick: 3, seed: 91 });
el('path', { d: 'M938 284 L954 284 L946 294 Z', fill: STITCH }, svg);
div('abs line', 'left:812px; top:247px; width:268px; justify-content:center; color:#ffb08a; font-weight:800; font-size:18px', S,
  icon('claw', 24, LIGHT) + 'Next: Thorn Charge <span class="dim" style="font-weight:700">~18 dmg</span>');

// --- The log: a linen ribbon across the top, the newest line darkest (Persona's top banner).
{
  const x = 330, y = 18, w = 450, h = 70, n = 16;
  const ribbon = `M${x} ${y} H${x + w} L${x + w - n} ${y + h / 2} L${x + w} ${y + h} H${x} L${x + n} ${y + h / 2} Z`;
  for (let i = 0; i < 3; i++) el('path', { d: ribbon, transform: `translate(${2 - i} ${6 - i})`, fill: 'rgba(10,8,6,.12)' }, svg);
  el('path', { d: ribbon, transform: 'translate(0 3)', fill: shade(LINEN, 0.3) }, svg);
  el('path', { d: ribbon, fill: LINEN }, svg);
  for (const sy of [y + 7, y + h - 7]) {
    el('path', { d: `M${x + 24} ${sy}H${x + w - 24}`, stroke: 'rgba(0,0,0,.3)', 'stroke-width': 2.1, 'stroke-dasharray': '6 5', 'stroke-linecap': 'round', transform: 'translate(.8 1.2)' }, svg);
    el('path', { d: `M${x + 24} ${sy}H${x + w - 24}`, stroke: LINEN_STITCH, 'stroke-width': 2, 'stroke-dasharray': '6 5', 'stroke-linecap': 'round' }, svg);
  }
  div('abs', `left:${x + 30}px; top:${y + 15}px; width:${w - 60}px; color:#2a1d16; font-size:15px; font-weight:500; opacity:.6; text-align:center; white-space:nowrap`, S,
    'Thornback Boar uses Thorn Charge: 12 damage to you.');
  div('abs', `left:${x + 30}px; top:${y + 36}px; width:${w - 60}px; color:#2a1d16; font-size:19px; font-weight:800; text-align:center; white-space:nowrap`, S,
    'You use Heavy Strike: <span style="color:#8a4a00">15 damage</span>.');
}

// --- Commands (Persona 5: hierarchy). One big Attack, the rest smaller beside it.
{
  const x = 520, y = 566, w = 230, h = 132;
  const g = el('g', { transform: `rotate(-3 ${x + w / 2} ${y + h / 2})` }, svg);
  patch(g, x, y, w, h, { cloth: RED, thread: RED_STITCH, inset: 7, r: 16, dash: 6, gap: 5, thick: 6, rim: 0.12, seed: 31 });
  const b = div('abs btn', `left:${x}px; top:${y}px; width:${w}px; height:${h}px; color:#fff4dc; transform: rotate(-3deg)`, S,
    `<div class="label" style="font-size:38px; text-shadow: 0 2px 0 #5a160c, 0 -1px 0 #5a160c, 1px 0 0 #5a160c, -1px 0 0 #5a160c">${icon('sword', 40, LIGHT)}Attack</div>`);
  key(x - 6, y - 10, 1);
}
const small = [
  { label: 'Skills', icon: 'book', sub: '1 NEW' }, { label: 'Items', icon: 'bag' }, { label: 'Defend', icon: 'shield', sub: '-60% dmg, +MP' },
  { label: 'Flee', icon: 'boot', sub: '90%' }, { label: 'Swap', icon: 'swap', sub: 'No spare', off: true },
];
small.forEach((b, i) => {
  const x = 770 + (i % 3) * 166, y = 568 + Math.floor(i / 3) * 70, w = 156, h = 58, tilt = [-1, 0.8, -0.5, 0.6, -0.8][i];
  const g = el('g', { transform: `rotate(${tilt} ${x + w / 2} ${y + h / 2})`, opacity: b.off ? 0.5 : 1 }, svg);
  patch(g, x, y, w, h, { cloth: SAND, thread: SAND_STITCH, inset: 5, r: 12, dash: 5, gap: 4, thick: 4, rim: 0.1, seed: 40 + i });
  div('abs btn', `left:${x}px; top:${y}px; width:${w}px; height:${h}px; transform: rotate(${tilt}deg); opacity:${b.off ? 0.5 : 1}`, S,
    `<div class="label" style="font-size:21px">${icon(b.icon, 22)}${b.label}</div>` + (b.sub ? `<div class="sub">${b.sub}</div>` : ''));
  key(x - 7, y - 9, i + 2);
});
</script>
</body>
</html>
