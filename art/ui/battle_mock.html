<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Round 13 battle mock: the UI is hand-made (CSS + hand-drawn SVG icons), only the art images are generated. -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1a24; --ink2: #2e2b3a; --cream: #f3e6c8; --sand: #d9c39a;
    --red: #e8483a; --red-d: #a82a2a; --blue: #3f6fb8; --blue-l: #8ab8e8;
    --amber: #f5c542; --amber-d: #c8962a; --teal: #2a8a88; --teal-l: #5cc0b0;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1664px; height: 928px; overflow: hidden; font-family: 'Fredoka', 'Bahnschrift', sans-serif; background: #22402a; }
  .stage { position: relative; width: 1664px; height: 928px; background: url(../tests/flat/pick_forest.png) center / cover; }
  .hero { position: absolute; left: 250px; bottom: 150px; height: 520px; }
  .boar { position: absolute; right: 200px; bottom: 150px; height: 400px; }
  .shadow { position: absolute; bottom: 136px; height: 30px; border-radius: 50%; background: rgba(27, 26, 36, .28); }

  .card { position: absolute; top: 24px; display: flex; align-items: center; gap: 16px; padding: 14px 22px 14px 14px;
    background: var(--ink); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 rgba(27,26,36,.35); }
  .card.hero-card { left: 24px; }
  .card.enemy-card { right: 24px; flex-direction: row-reverse; padding: 14px 14px 14px 22px; }
  .portrait { width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--cream); background-color: var(--teal);
    background-repeat: no-repeat; flex: none; }
  .info { width: 330px; }
  .name { display: flex; justify-content: space-between; align-items: baseline; color: var(--cream); font-size: 30px; font-weight: 600; line-height: 1; margin-bottom: 10px; }
  .name small { font-size: 20px; color: var(--sand); font-weight: 500; }
  .bar { position: relative; height: 26px; border-radius: 13px; background: var(--ink2); border: 3px solid #4a4658; overflow: hidden; margin-top: 7px; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 10px; }
  .bar i::after { content: ''; position: absolute; left: 6px; right: 6px; top: 3px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); }
  .bar.hp i { background: var(--red); }
  .bar.mp i { background: var(--blue); }
  .bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
    color: var(--cream); font-size: 17px; font-weight: 600; text-shadow: 0 2px 0 rgba(27,26,36,.6); }
  .intent { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 4px 12px 4px 6px; border-radius: 14px;
    background: var(--amber); color: var(--ink); font-size: 18px; font-weight: 600; }
  .intent svg { width: 22px; height: 22px; }

  .dock { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 22px; align-items: center;
    padding: 14px 16px; background: var(--ink); border-radius: 26px; box-shadow: 0 6px 0 rgba(27,26,36,.35); }
  .skills { display: flex; gap: 12px; }
  .skill { position: relative; width: 92px; height: 92px; border-radius: 18px; background: var(--ink2); border: 4px solid #4a4658;
    display: grid; place-items: center; }
  .skill svg { width: 78px; height: 78px; }
  .skill .key { position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; border-radius: 50%; background: var(--cream);
    border: 3px solid var(--ink); color: var(--ink); font-size: 16px; font-weight: 700; display: grid; place-items: center; }
  .skill.weak { border-color: var(--amber); }
  .skill .tag { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); padding: 1px 9px; border-radius: 10px;
    background: var(--amber); border: 3px solid var(--ink); color: var(--ink); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .skill.cd svg { opacity: .35; }
  .skill.cd .cd-num { position: absolute; color: var(--cream); font-size: 34px; font-weight: 700; }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .btn { height: 42px; padding: 0 22px; border-radius: 14px; border: 4px solid var(--ink); font-size: 21px; font-weight: 600;
    display: grid; place-items: center; box-shadow: inset 0 -5px 0 rgba(27,26,36,.25); }
  .btn.main { height: 50px; font-size: 26px; background: var(--amber); color: var(--ink); }
  .btn.alt { background: var(--teal); color: var(--cream); flex: 1; }
  .btn.dim { background: #4a4658; color: var(--sand); flex: 1; }
</style>
</head>
<body>
<div class="stage">
  <div class="shadow" style="left: 270px; width: 230px"></div>
  <div class="shadow" style="right: 230px; width: 440px"></div>
  <img class="hero" src="../tests/flat/pick_hero.png">
  <img class="boar" src="../tests/flat/pick_boar.png">

  <div class="card hero-card">
    <div class="portrait" style="background-image: url(../tests/flat/portrait_hero.png); background-size: cover; background-position: center top"></div>
    <div class="info">
      <div class="name">Wanderer <small>Lv 3</small></div>
      <div class="bar hp"><i style="width: 80%"></i><b><span>HP</span><span>48 / 60</span></b></div>
      <div class="bar mp"><i style="width: 66%"></i><b><span>MP</span><span>20 / 30</span></b></div>
    </div>
  </div>

  <div class="card enemy-card">
    <div class="portrait" style="background-color: #d9c39a; background-image: url(../tests/flat/portrait_boar.png); background-size: cover"></div>
    <div class="info">
      <div class="name">Thornback Boar <small>Lv 3</small></div>
      <div class="bar hp"><i style="width: 62%"></i><b><span>HP</span><span>31 / 50</span></b></div>
      <div class="intent">
        <svg viewBox="0 0 64 64"><path d="M8 50 C8 30 22 14 46 10 C38 22 36 34 40 50 Z" fill="#f3e6c8" stroke="#1b1a24" stroke-width="5" stroke-linejoin="round"/></svg>
        Next: Gore
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="skills">
      <div class="skill weak"><span class="tag">Weak!</span>
        <svg viewBox="0 0 64 64"><g transform="rotate(45 32 32)" stroke="#1b1a24" stroke-width="4" stroke-linejoin="round">
          <polygon points="25,14 32,1 39,14 39,40 25,40" fill="#f3e6c8"/><polygon points="32,1 39,14 39,40 32,40" fill="#d9c39a"/>
          <rect x="15" y="40" width="34" height="8" rx="3" fill="#f5c542"/><rect x="28" y="48" width="8" height="9" fill="#6e5236"/>
          <circle cx="32" cy="59" r="4" fill="#f5c542"/></g></svg>
        <span class="key">1</span></div>
      <div class="skill">
        <svg viewBox="0 0 64 64"><g stroke="#1b1a24" stroke-width="4" stroke-linejoin="round">
          <path d="M32 5 L54 13 V30 C54 44 44 54 32 59 C20 54 10 44 10 30 V13 Z" fill="#2a8a88"/>
          <path d="M32 5 L54 13 V30 C54 44 44 54 32 59 Z" fill="#5cc0b0"/>
          <circle cx="32" cy="30" r="7" fill="#f5c542"/></g></svg>
        <span class="key">2</span></div>
      <div class="skill cd">
        <svg viewBox="0 0 64 64"><g stroke="#1b1a24" stroke-width="4" stroke-linejoin="round">
          <path d="M32 4 C40 16 50 24 50 38 C50 50 42 59 32 59 C22 59 14 50 14 38 C14 30 19 24 24 18 C26 26 29 28 32 28 C30 20 30 12 32 4 Z" fill="#f08a2c"/>
          <path d="M32 32 C38 39 42 43 42 48 C42 54 37 58 32 58 C27 58 22 54 22 48 C22 42 28 39 32 32 Z" fill="#f5c542"/></g></svg>
        <span class="cd-num">2</span><span class="key">3</span></div>
      <div class="skill">
        <svg viewBox="0 0 64 64"><g stroke="#1b1a24" stroke-width="4" stroke-linejoin="round">
          <path d="M10 54 C10 30 26 10 54 10 C54 36 36 54 10 54 Z" fill="#6f9a3a"/>
          <path d="M10 54 C10 30 26 10 54 10 Z" fill="#b8c95a"/>
          <path d="M16 48 L46 18" fill="none" stroke-linecap="round"/></g></svg>
        <span class="key">4</span></div>
      <div class="skill">
        <svg viewBox="0 0 64 64"><polygon points="38,4 14,36 30,36 23,60 50,25 34,25 44,4" fill="#f5c542" stroke="#1b1a24" stroke-width="4" stroke-linejoin="round"/>
          <polygon points="38,4 44,4 34,25 50,25 23,60 30,36" fill="#c8962a" opacity=".55"/></svg>
        <span class="key">5</span></div>
    </div>
    <div class="actions">
      <div class="btn main">Attack</div>
      <div class="row"><div class="btn alt">Items</div><div class="btn dim">Flee</div></div>
    </div>
  </div>
</div>
</body>
</html>
